name: Phase 4 Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [chatgpt/phase4a-microstructure-core]
  workflow_dispatch:

jobs:
  regression:
    name: py${{ matrix.python-version }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        profile: [minimal, hmm]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install minimal package
        if: matrix.profile == 'minimal'
        run: |
          pip install -e .
          pip install pytest

      - name: Install HMM extras
        if: matrix.profile == 'hmm'
        run: |
          pip install -e ".[hmm]"
          pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q regime scripts

      - name: Run full repository tests
        run: python -m pytest -q
